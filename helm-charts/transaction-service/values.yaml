replicaCount: 3

image:
  repository: registry.internal/payments/transaction-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 10
  periodSeconds: 5

deploymentStrategy:
  type: BlueGreen   # or Canary

istio:
  enabled: true
  mtls: STRICT

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
