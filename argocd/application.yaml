apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: transaction-service-prod
  namespace: argocd
spec:
  project: payments

  source:
    repoURL: https://github.com/anuj-devops/devops-reference-architecture.git
    targetRevision: main
    path: helm-charts/transaction-service

  destination:
    server: https://kubernetes.default.svc
    namespace: payments-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
